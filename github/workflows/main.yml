name: Vortix Ultra Engine

on:
  repository_dispatch:
    types: [telegram_message]

jobs:
  run_bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Execute Core Logic
        env:
          TG_PAYLOAD: ${{ jsonEncode(github.event.client_payload) }}
        run: python bot.py

      - name: Auto Push Changes to Pages
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Vortix Core Sub Updated" && git push origin main)
          
